# /etc/nginx/sites-available/wallet.samtama.lol
# Production wallet v2 (Hono/Postgres stack, compose project wallet2): PWA at / and API at /api.
# Proxies to the production container on 127.0.0.1:8080 (compose project wallet2).
# (wallet.samtama.lol) is untouched.
#
# Install order matters — the cert must exist before the 443 block can load:
#   1. install ONLY the port-80 server block below, `nginx -t && systemctl reload nginx`
#   2. `certbot --nginx -d wallet.samtama.lol` (HTTP-01 works through the
#      Cloudflare proxy; the record is already proxied)
#   3. install this full file, `nginx -t && systemctl reload nginx`
#
# Once the cert exists this file is safe to re-apply at any time:
#   sudo cp /tmp/nginx-wallet.conf /etc/nginx/sites-available/wallet.samtama.lol
#   sudo nginx -t && sudo systemctl reload nginx
# See deploy/VPS_SETUP.md → "v2 production (cutover 2026-09-13)".

server {
    include snippets/block-probes.conf;
    listen 80;
    server_name wallet.samtama.lol;
    return 301 https://$host$request_uri;
}

server {
    include snippets/block-probes.conf;
    include snippets/cloudflare-realip.conf;
    listen 443 ssl;
    http2 on;
    server_name wallet.samtama.lol;

    ssl_certificate /etc/letsencrypt/live/wallet.samtama.lol/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wallet.samtama.lol/privkey.pem;

    location / {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        # PWA-appropriate CSP: same-origin app and API; inline styles are used by the React app; no plugins, no framing.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite whatever the client sent: the app reads these headers for rate-limit
        # buckets, so only nginx may set them.
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 10m;
    }
}
