# /etc/nginx/sites-available/wallet.samtama.lol
# API for the SMS finance tracker (proxied through Cloudflare).
# Replaces the old irs-bot config (which only exposed /health by IP).
#
# First-time setup on the VPS (cert does not exist yet, so install in two steps):
#   1. Cloudflare DNS: add A record wallet.samtama.lol -> 193.187.129.179 (proxied)
#   2. Install ONLY the port-80 server block below (comment out the 443 block),
#      ln -s into sites-enabled, nginx -t && systemctl reload nginx
#   3. certbot --nginx -d wallet.samtama.lol   (issues cert via HTTP-01)
#   4. Restore the full file, nginx -t && systemctl reload nginx
#   5. rm /etc/nginx/sites-enabled/irs-bot   (superseded), reload nginx

server {
    include snippets/block-probes.conf;
    listen 80;
    server_name wallet.samtama.lol;
    return 301 https://$host$request_uri;
}

server {
    include snippets/block-probes.conf;
    include snippets/cloudflare-realip.conf;
    listen 443 ssl http2;
    server_name wallet.samtama.lol;

    ssl_certificate /etc/letsencrypt/live/wallet.samtama.lol/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wallet.samtama.lol/privkey.pem;

    # JSON API only — no static content.
    location / {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'none'" always;
        add_header X-Frame-Options "DENY" always;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        proxy_redirect off;
    }
}
