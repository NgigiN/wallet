name: Deploy to Server

# Production deploys run only on version tags (or manually). CI (ci.yml) gates every PR;
# this workflow builds the compose stack on the VPS from the tagged commit.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - name: Deploy compose stack
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_REF: ${{ github.ref_name }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: DEPLOY_REF
          script: |
            set -e
            cd /home/deploy/opt/wallet
            git fetch --tags origin
            git checkout -q "${DEPLOY_REF}"
            cd deploy
            APP_VERSION="${DEPLOY_REF}" docker compose --env-file .env -f compose.yml up -d --build
            for i in $(seq 1 30); do
              if curl -fs http://127.0.0.1:8080/health >/dev/null; then echo "healthy"; exit 0; fi
              sleep 2
            done
            echo "health check failed"; docker compose --env-file .env -f compose.yml logs --tail 50 api; exit 1
      - name: Verify through the edge
        run: |
          for i in $(seq 1 10); do
            if curl -fs https://wallet.samtama.lol/health | grep -q '"db":"ok"'; then echo "edge healthy"; exit 0; fi
            sleep 6
          done
          echo "edge health check failed"; exit 1
